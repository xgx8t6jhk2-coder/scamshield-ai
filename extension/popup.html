<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>ScamShield AI Guard</title>
  <link rel="stylesheet" href="ui.css">
  <script type="module" src="ui.js"></script>
</head>
<body class="popup">
  <main>
    <header><img src="icons/shield-48.png" alt=""><span data-text="name"></span></header>
    <section class="summary">
      <div class="ring" aria-hidden="true"><span id="score">–</span></div>
      <div class="identity">
        <h1 id="verdict" aria-live="polite"></h1>
        <bdi id="host" class="host"></bdi>
      </div>
    </section>
    <section id="details" hidden>
      <h2 data-text="signals"></h2>
      <ul id="signals"></ul>
      <p id="official" hidden><span data-text="official"></span> <bdi></bdi></p>
    </section>
    <footer>
      <button id="report" type="button" data-text="report" hidden></button>
      <p id="status" role="status" hidden></p>
      <a href="https://scamshield-ai-eaj.pages.dev" target="_blank" rel="noopener noreferrer" data-text="visit"></a>
    </footer>
  </main>
</body>
</html>
